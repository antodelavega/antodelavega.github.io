<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent - RSO* Afocal </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5bbf21;
            --primary-dark: #bdd804;
            --secondary-color: #bdd804;
            --text-color: #000000;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --locked-bg: #eaeff2;
            --locked-text: #1c3d5a;
        }
        
        body {
            font-family: 'Nunito';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

       header {
            position: relative;
            overflow: hidden; /* Permet à la ligne de couleurs de suivre les bords arrondis */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            text-align: center;
            margin-bottom: 30px;
            padding: 25px 35px 28px 35px; /* Espace en haut réservé au logo dans le coin */
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Ligne de couleurs Afocal tout en haut du pavé */
        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(
                to right,
                #0072c6 0% 14%,  
                #ffffff 14% 15%,
                #5bbf21 15% 28%,   
                #ffffff 28% 29%,
                #d99390 29% 42%,  
                #ffffff 42% 43%,
                #fdc034 43% 56%,  
                #ffffff 56% 57%,
                #fed133 57% 70%,  
                #ffffff 70% 71%,
                #bdd804 71% 84%,  
                #ffffff 84% 85%,
                #87ccd8 85% 100%
            );
        }
        
        .header-logo {
            position: absolute;
            top: 2px;
            right: 2px;
            max-height: 75px;
            width: auto;
            background: transparent;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.18));
        }
        
        .header-content {
            flex: 1;
        }
        
        /* Adaptation mobile */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px 25px 20px;
            }
        
            .header-logo {
                position: static;
                margin-bottom: 12px;
                max-height: 45px;
            }
        
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2em;
        }

         header h3 {
            margin: 0 0 10px 0;
            font-size: 1.4em;
            font-style: italic;
            opacity: 0.8;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
        }

        .card.unlocked:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .card.locked {
            background-color: var(--locked-bg);
            border-color: #cfd8dc;
            color: var(--locked-text);
        }

        .card.locked:hover {
            border-color: #b0bec5;
        }

        .card-number {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card.locked .card-number {
            color: var(--locked-text);
        }

        .card-title {
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
            color: #555;
        }

        .card.locked .card-title {
            color: var(--locked-text);
        }

        .card-tag {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
            font-weight: bold;
        }

        .tag-kit { background-color: #e3f2fd; color: #1565c0; }
        .tag-outil { background-color: #fff3e0; color: #e65100; }
        .tag-rso { background-color: #e8f5e9; color: #2e7d32; }
        .tag-locked { background-color: #eceff1; color: #78909c; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8em;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover { color: #000; }

        .modal-header {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 10px 0 0 0;
            color: var(--primary-color);
        }

        .channel-info {
            font-size: 0.95em;
            color: #444;
            margin-bottom: 15px;
        }

        .message-box {
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.4;
        }

        .action-box {
            background-color: var(--secondary-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
        }

        .doc-mention {
            margin-top: 20px;
            padding: 12px;
            background-color: #f1f3f4;
            border-radius: 6px;
            font-size: 0.9em;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-content">
            <img id="logo-afocal" src="https://lh3.googleusercontent.com/d/1A52hvzmZ2P5KWZIeIjF_F4moUmXt-oEj" alt="Logo Afocal" class="header-logo">
            <h1>Calendrier de l'Avent - RSO* Afocal</h1>
            <h3>*Responsablité Sociétale des Organisations</h3>
            <p>En attendant Noël, 18 pauses avec de bons réflexes pour prendre soin de soi et de l’humanité</p>
        </div>
    </header>

    <div class="grid" id="calendar-grid"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="modal-close-btn">&times;</span>
        <div class="modal-header">
            <span id="modal-tag" class="card-tag"></span>
            <h2 id="modal-title"></h2>
        </div>
        <div class="channel-info" id="modal-channel-container">📢 <b>Intranet - 9h</b></div>
        <div class="message-box" id="modal-message"></div>
        <div class="action-box" id="modal-action-container">🎯 <b>Micro-action du jour :</b> <span id="modal-action"></span></div>
        <div class="doc-mention" id="modal-file-container">
            📄 <b>Document(s) :</b> <span id="modal-file"></span>
            
            <!-- Zone d'insertion du document (masquée par défaut) -->
            <iframe id="modal-embed" src="" style="display:none; width: 100%; height: 350px; margin-top: 15px; border: 1px solid #ccc; border-radius: 8px;"></iframe>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var currentYear = new Date().getFullYear();

    var days = [
        { day: 1, dateStr: currentYear + "-12-01", displayDate: "Mardi 1er Décembre", title: "Lancement RSO", tag: "rso", tagLabel: "Action RSO", message: "🎄 Noël approche ! On vous propose un mois de décembre ancré sur notre démarche RSO (Responsabilité Sociale des Organisations) : Prendre soin de l'humanité. Ce calendrier a pour vocation de vous aider à prendre soin de vous, des autres et de la planète :)", action: "Connais-tu bien tous tes collègues ? Va faire un tour sur LUCCA et retrouve le “LUCCA faces” pour identifier qui est qui. Pour te féliciter de tes réussites, définis une intention bienveillante à réaliser pour la suite de ta journée de travail qui soit tourner vers toi.", file: "Logiciel LUCCA, dans l’interface à l’ouverture" },
        { day: 2, dateStr: currentYear + "-12-02", displayDate: "Mercredi 2 Décembre", title: "Reconnaître ses émotions", tag: "kit", tagLabel: "Kit Bien-être 1/11", message: "♥️ Savoir nommer une émotion est la première étape pour l'accepter et savoir la gérer.", action: "Et si je parcourais le lexique pour mettre un mot sur mon émotion du moment ?", file: "Ressources Afocal - émotion", embedUrl : "https://drive.google.com/file/d/1HiL7CaMlmepW14ykDmP3M-mx1UKijaM4/preview" },
        { day: 3, dateStr: currentYear + "-12-03", displayDate: "Jeudi 3 Décembre", title: "La santé mentale", tag: "outil", tagLabel: "Outil Afocal", message: "🧠 L'attention porté à notre santé mentale est celle des autres est cruciale, d'autant plus dans le développement des jeunes. Et si on faisait le point de notre connaissance sur le sujet ?", action: "« La santé mentale, tu connais ? » : Je parcours l'outil de l'UNOSEL, conçu pour les animateurs et directeurs de séjour.", file: "Ressource UNOSEL", fileUrl : "https://lasantementaletuconnais.org/" },
        { day: 4, dateStr: currentYear + "-12-04", displayDate: "Vendredi 4 Décembre", title: "Se relaxer", tag: "kit", tagLabel: "Kit Bien-être 2/11", message: "😮‍💨 Les exercices de relaxation permettent de se détendre aussi bien sur le plan physique qu'émotionnel, tout au long de la journée.", action: "Et si je m'accordais 3 minutes de relaxation dans la journée ?", file: "Ressources Afocal - Relaxation", embedUrl : "https://drive.google.com/file/d/1KjSi24Ql3WgsJ12VBkck1EmBO_yN2uOD/preview" },
        { day: 5, dateStr: currentYear + "-12-07", displayDate: "Lundi 7 Décembre", title: "Être là pour les autres", tag: "kit", tagLabel: "Kit Bien-être 8/11", message: "🎁 Apporter de l'aide à quelqu'un, valoriser le travail d'un collègue ou complimenter un autre fait autant de bien à celui qui donne qu'à celui qui reçoit.", action: "Un sourire, une discussion avec un collègue ou un café offert : et si je me tournais vers les autres aujourd'hui ?", file: "Ressources Afocal - Entraide", embedUrl : "https://drive.google.com/file/d/1SJlLN6claCB0gfSL9w6u74V_OeCOCDZd/preview" },
        { day: 6, dateStr: currentYear + "-12-08", displayDate: "Mardi 8 Décembre", title: "Cartes Forces & CPS", tag: "outil", tagLabel: "Outil Afocal", message: "🃏 Une compétence est acquise à travers l'expérience et le travail. Quant à elle, une force est une qualité naturelle qui fait partie de notre personnalité.", action: "Et si je parcourais les cartes forces afin de repérer les 5 qui me ressemblent le plus ?", file: "CRIPS & Afocal - Cartes Forces", embedUrl :"https://drive.google.com/file/d/1by7-wLpzmFzd558HB1K-Iz0UwxUucK0w/preview" },
        { day: 7, dateStr: currentYear + "-12-09", displayDate: "Mercredi 9 Décembre", title: "S'aérer", tag: "kit", tagLabel: "Kit Bien-être 4/11", message: "🌤️ Avez-vous pris un temps pour vous aérer aujourd'hui ?", action: "Et si je sortais prendre l'air pendant 15 minutes sur ma pause déjeuner aujourd'hui ? L'occasion de lever les yeux et d'observer l'environnement avec mes 5 sens.", file: "Ressources Afocal - S'aérer", embedUrl : "https://drive.google.com/file/d/1UMFx9JYQPLBraICThJxfya7y1kJ7QfQ_/preview" },
        { day: 8, dateStr: currentYear + "-12-10", displayDate: "Jeudi 10 Décembre", title: "Manger mieux", tag: "kit", tagLabel: "Kit Bien-être 5/11", message: "🥗 L'alimentation est un pilier de nos vies, au coeur de tout le reste. Retrouvez des repères simples et durables pour mieux s'alimenter.", action: "Et si je pensais à m'hydrater réguliérement aujourd'hui ? Et si j'y faisais penser à un(e) collègue ?", file: "Ressources Afocal - Manger", embedUrl : "https://drive.google.com/file/d/1NkOftOUmAhFqxfnlwgqZQuFUsKw80RDK/preview" },
        { day: 9, dateStr: currentYear + "-12-11", displayDate: "Vendredi 11 Décembre", title: "Bien dormir", tag: "kit", tagLabel: "Kit Bien-être 6/11", message: "😴 Bien dormir, c'est se mettre dans de meilleures dispositions énergétiques, physiques et émotionnelles pour la journée à vivre.", action: "Et si je limitais mon temps d'écran sur les pauses et en fin de journée ? Et si j'éteignais tous mes écrans 30 minutes avant de dormir pour m'offrir une vraie nuit reposante ?", file: "Ressources Afocal - Sommeil", embedUrl : "https://drive.google.com/file/d/1f0d9NrWlUf18SYTM63lNig5Cq0JZn5GT/preview" },
        { day: 10, dateStr: currentYear + "-12-14", displayDate: "Lundi 14 Décembre", title: "Origami & Créativité", tag: "outil", tagLabel: "Outil Afocal", message: "📄 Les activités manuelles stimulent notre concentration et favorisent la relaxation. Utilisez un outil ludique pour ouvrir la discussion sur la santé mentale.", action: "Et si je prenais 5 minutes pour construire l'origami de la santé mentale et pour le tester avec un(e) collègue ?", file: "Origami - Santé mentale", embedUrl :"https://drive.google.com/file/d/1kPMRT8pl6xjj2Lk-b8yHP4Aj2EEih69U/preview" },
        { day: 11, dateStr: currentYear + "-12-15", displayDate: "Mardi 15 Décembre", title: "Bouger plus", tag: "kit", tagLabel: "Kit Bien-être 7/11", message: "🚶 Bouger au quotidien est extrêmement bénefique tant pour votre santé physique que mentale.", action: "Et si je mettais une alarme toutes les heures pour me lever et m'étirer ?", file: "Ressources Afocal - Bouger", embedUrl : "https://drive.google.com/file/d/1MGDnuxY5M4nx3mwmSbez6_zD-FnOtBNs/preview" },
        { day: 12, dateStr: currentYear + "-12-16", displayDate: "Mercredi 16 Décembre", title: "Parler quand ça ne va pas", tag: "kit", tagLabel: "Kit Bien-être 11/11", message: "💬 Exprimer ses difficultés permet de prendre du recul, c'est la première marche pour aller mieux.", action: "Je prends 2 minutes pour découvrir les lignes d'écoute et dispositifs d'accompagnement à ma disposition.", file: "Ressources Afocal - Parler", embedUrl : "https://drive.google.com/file/d/17XnedLPUORneSB65tPS6ihL_GsNjPABW/preview" },
        { day: 13, dateStr: currentYear + "-12-17", displayDate: "Jeudi 17 Décembre", title: "Se centrer sur le positif", tag: "kit", tagLabel: "Kit Bien-être 3/11", message: "🌈 Face aux ondes négatives parfois envahissantes, mobilisons nous pour créer un espace et un environnement plus positif.", action: "Et si je prenais un instant pour noter 3 réussites ou moments positifs de ma semaine passée ?", file: "Ressources Afocal - Positif", embedUrl : "https://drive.google.com/file/d/1IrWlzGh7i4pLI596ZShxE-ayN5ZPM2eQ/preview" },
        { day: 14, dateStr: currentYear + "-12-18", displayDate: "Vendredi 18 Décembre", title: "Réduire les substances", tag: "kit", tagLabel: "Kit Bien-être 9/11", message: "🍷 Alcool, sucre, tabac... faisons le point sereinement sur nos consommations de stimulants et leurs impacts à long terme.", action: "Et si je remplaçais aujourd'hui une boisson stimulante par une verveine ou une eau infusée ?", file: "Ressources Afocal - Addictions", embedUrl : "https://drive.google.com/file/d/1if6OonHiSjGFqAdrGkpCFylTpAl6wzMh/preview" },
        { day: 15, dateStr: currentYear + "-12-21", displayDate: "Lundi 21 Décembre", title: "Profiter des fêtes durablement", tag: "outil", tagLabel: "Outil Afocal", message: "🎅 En cette période festive, comment gâter chacun tout en évitant le gaspillage ? Recyclage, réemploi, seconde main, retrouvez des repères durables de consommation.", action: "Et si je cherchais un objet que je pensais acheter sur une plateforme de dons ? Et si j'emballais mes cadeaux de noël sans papier cadeau cette année ?", file: "Ressources à découvrir.", fileUrl: [{ label: "Site de GEEV", url: "https://www.geev.com/fr/recherche/objets" },{ label: "Emballages cadeaux", url: "https://www.marieclaire.fr/idees/9-idees-pour-emballer-un-cadeau-sans-papier-cadeau,1281143.asp" }] },
        { day: 16, dateStr: currentYear + "-12-22", displayDate: "Mardi 22 Décembre", title: "Pratiquer un loisir", tag: "kit", tagLabel: "Kit Bien-être 10/11", message: "🎸 Choisir de pratiquer une activité sportive, culturelle, créative au delà de son quotidien professionnel permet de trouver un bon équilibre pour sa santé mentale", action: "Et si je partageais avec un collègue une passion personnelle ?", file: "Ressources Afocal - Loisirs", embedUrl : "https://drive.google.com/file/d/1rSHntWe9aBvdUZuMfHatRtEYzf14NE9-/preview" },
        { day: 17, dateStr: currentYear + "-12-23", displayDate: "Mercredi 23 Décembre", title: "Prendre soin de soi", tag: "rso", tagLabel: "Action RSO", message: "🤝 Ce calendrier s'approche de sa fin, mais les outils eux ne disparaissent pas. Avec la mutuelle AESIO choisie par l'Afocal, viennent des avantages destinés à vous acoompagner pour prendre soin de vous.", action: "Et si je parcourais les coups de pouces apportés par AESIO ? ", file: "Mon espace adhérent AESIO et ses outils",  fileUrl : "https://adherent.aesio.fr/" },
        { day: 18, dateStr: currentYear + "-12-24", displayDate: "Jeudi 24 Décembre", title: "Checklist Congés & Bilan", tag: "rso", tagLabel: "Action RSO", message: "🎄 Joyeux réveillon ! Ce calendrier RSO touche à sa fin pour laisser place au doux parfum des fêtes. Une bonne occasion d'utiliser tous les outils présentés pour prendre soin de vous, de vos proches et de l'humanité. Merci de votre intérêt pour ce projet collectif et bonnes vacances à tous, riche de la rencontre avec l’autre, vos proches, vos amis, vos voisins… ", action: "Je prends 5 minutes pour choisir les outils les plus pertinents à utiliser pour prendre soin de l'humanité en cette période de fête.", file: "Retrouvez l'ensemble des ressources utilisées, ainsi que leurs inspirations !", fileUrl: [{label: "L'inspiration des cases bien-être", url : "https://www.santementale-info-service.fr/"}, {label: "L'ensemble des ressources du calendrier", url: "https://drive.google.com/drive/folders/1AQAyRvlh9mv1LAydNY3XxBpZrWVmDPEm"}]  }
    ];

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var urlParams = new URLSearchParams(window.location.search);
    var isTestMode = urlParams.get('test') === 'true';

    var grid = document.getElementById('calendar-grid');

    days.forEach(function(data) {
        var parts = data.dateStr.split('-');
        var targetDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        targetDate.setHours(0, 0, 0, 0);

        var isUnlocked = isTestMode || (today >= targetDate);

        var card = document.createElement('div');
        card.className = 'card ' + (isUnlocked ? 'unlocked' : 'locked');
        card.onclick = function() { openModal(data, isUnlocked); };

        var topDiv = document.createElement('div');
        
        var numDiv = document.createElement('div');
        numDiv.className = 'card-number';
        numDiv.textContent = 'Jour ' + data.day;

        var titleDiv = document.createElement('div');
        titleDiv.className = 'card-title';
        titleDiv.textContent = isUnlocked ? data.title : '???';

        topDiv.appendChild(numDiv);
        topDiv.appendChild(titleDiv);

        var bottomDiv = document.createElement('div');
        
        var tagSpan = document.createElement('span');
        if (isUnlocked) {
            tagSpan.className = 'card-tag tag-' + data.tag;
            tagSpan.textContent = data.tagLabel;
        } else {
            tagSpan.className = 'card-tag tag-locked';
            tagSpan.textContent = '🔒 Verrouillé';
        }
        
        bottomDiv.appendChild(tagSpan);

        card.appendChild(topDiv);
        card.appendChild(bottomDiv);

        grid.appendChild(card);
    });

    function openModal(data, isUnlocked) {
        var channelContainer = document.getElementById('modal-channel-container');
        var actionContainer = document.getElementById('modal-action-container');
        var fileContainer = document.getElementById('modal-file-container');
        var fileSpan = document.getElementById('modal-file');
        var iframeEmbed = document.getElementById('modal-embed');

        if (isUnlocked) {
            document.getElementById('modal-title').textContent = 'Jour ' + data.day + ' — ' + data.title;
            
            var tagEl = document.getElementById('modal-tag');
            tagEl.textContent = data.tagLabel;
            tagEl.className = 'card-tag tag-' + data.tag;
            
            document.getElementById('modal-message').textContent = data.message;
            document.getElementById('modal-action').textContent = data.action;

           if (data.fileUrl) {
               if (Array.isArray(data.fileUrl)) {
                   // Plusieurs liens : on les affiche tous, séparés par une barre
                   fileSpan.innerHTML = data.fileUrl.map(function(lien) {
                       return '<a href="' + lien.url + '" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: underline;">' + lien.label + ' 🔗</a>';
                   }).join(' &nbsp;|&nbsp; ');
               } else {
                   // Un seul lien : comportement actuel conservé
                   fileSpan.innerHTML = '<a href="' + data.fileUrl + '" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: underline;">' + data.file + ' 🔗</a>';
               }
           } else {
               fileSpan.textContent = data.file;

           if (data.embedUrl) {
                var formattedEmbedUrl = data.embedUrl.replace(/\/edit.*$/, '/preview').replace(/\/view.*$/, '/preview');
                iframeEmbed.src = formattedEmbedUrl;
                iframeEmbed.style.display = 'block';
           } else {
                iframeEmbed.src = 'about:blank';
                iframeEmbed.style.display = 'none';
            }
           }

            channelContainer.style.display = 'block';
            actionContainer.style.display = 'block';
            fileContainer.style.display = 'block';
        } else {
            document.getElementById('modal-title').textContent = 'Jour ' + data.day + ' — Case fermée';
            
            var tagEl = document.getElementById('modal-tag');
            tagEl.textContent = '🔒 Pas encore disponible';
            tagEl.className = 'card-tag tag-locked';
            
            document.getElementById('modal-message').textContent = "⏳ Patience ! Cette case s'ouvrira automatiquement le " + data.displayDate + " à 9h00.";
            
            iframeEmbed.src = 'about:blank';
            iframeEmbed.style.display = 'none';

            channelContainer.style.display = 'none';
            actionContainer.style.display = 'none';
            fileContainer.style.display = 'none';
        }

        document.body.style.overflow = 'hidden';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        var iframeEmbed = document.getElementById('modal-embed');
        if (iframeEmbed) {
            iframeEmbed.src = 'about:blank';
        }
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = '';
    }

    // Gestion du clic sur la croix de fermeture
    document.getElementById('modal-close-btn').onclick = closeModal;

    // Gestion du clic à l'extérieur de la carte (sur le fond d'arrière-plan)
    var modalElement = document.getElementById('modal');
    modalElement.onclick = function(event) {
        if (event.target === modalElement) {
            closeModal();
        }
    };
        // Suppression automatique du fond blanc du logo
});
</script>

</body>
</html>
