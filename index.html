<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier RSO Afocal - Test Novembre</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-dark: #1b5e20;
            --secondary-color: #e8f5e9;
            --text-color: #2c3e50;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --locked-bg: #eaeff2;
            --locked-text: #90a4ae;
        }

        body {
            font-family: 'Nunito', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2em;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
        }

        .card.unlocked:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .card.locked {
            background-color: var(--locked-bg);
            border-color: #cfd8dc;
            color: var(--locked-text);
        }

        .card.locked:hover {
            border-color: #b0bec5;
        }

        .card-number {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card.locked .card-number {
            color: var(--locked-text);
        }

        .card-title {
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
            color: #555;
        }

        .card.locked .card-title {
            color: var(--locked-text);
        }

        .card-tag {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
            font-weight: bold;
        }

        .tag-kit { background-color: #e3f2fd; color: #1565c0; }
        .tag-outil { background-color: #fff3e0; color: #e65100; }
        .tag-rso { background-color: #e8f5e9; color: #2e7d32; }
        .tag-locked { background-color: #eceff1; color: #78909c; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8em;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover { color: #000; }

        .modal-header {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 10px 0 0 0;
            color: var(--primary-color);
        }

        .channel-info {
            font-size: 0.95em;
            color: #444;
            margin-bottom: 15px;
        }

        .message-box {
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.4;
        }

        .action-box {
            background-color: var(--secondary-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
        }

        .doc-mention {
            margin-top: 20px;
            padding: 12px;
            background-color: #f1f3f4;
            border-radius: 6px;
            font-size: 0.9em;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍂 Calendrier RSO Afocal (Test Novembre)</h1>
        <p>Prendre soin de l'humanité — 18 pauses bien-être et sécurité au quotidien</p>
    </header>

    <div class="grid" id="calendar-grid"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="modal-close-btn">&times;</span>
        <div class="modal-header">
            <span id="modal-tag" class="card-tag"></span>
            <h2 id="modal-title"></h2>
        </div>
        <div class="channel-info" id="modal-channel-container">📢 <b>Gchat/Intranet - 9h</b></div>
        <div class="message-box" id="modal-message"></div>
        <div class="action-box" id="modal-action-container">🎯 <b>Micro-action du jour :</b> <span id="modal-action"></span></div>
        <div class="doc-mention" id="modal-file-container">
            📄 <b>Document à utiliser :</b> <span id="modal-file"></span>
            
            <!-- Zone d'insertion du document (masquée par défaut) -->
            <iframe id="modal-embed" src="" style="display:none; width: 100%; height: 350px; margin-top: 15px; border: 1px solid #ccc; border-radius: 8px;"></iframe>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var currentYear = new Date().getFullYear();

    var days = [
        { day: 1, dateStr: currentYear + "-11-02", displayDate: "Lundi 2 Novembre", title: "Lancement RSO", tag: "rso", tagLabel: "Action RSO", message: "🎄 Noël approche ! On vous propose un mois de décembre ancré sur notre démarche RSO (Responsabilité Sociale des Organisations) : Prendre soin de l'humanité. Ce calendrier a pour vocation de vous aider à prendre soin de vous, des autres et de la planète :)", action: "Définir une intention bienveillante pour sa journée de travail.", file: "Rien?" },
        { day: 2, dateStr: currentYear + "-11-03", displayDate: "Mardi 3 Novembre", title: "Reconnaître ses émotions", tag: "kit", tagLabel: "Kit Bien-être 1/11", message: "♥️ Savoir nommer une émotion est la première étape pour la traiter et se soigner si nécessaire.", action: "Parcourir le lexique et nommer l'émotion dominante du moment.", file: "Kit - émotion", embedUrl : "https://drive.google.com/file/d/1YxgnudQyBZntFF3r2srROl7Gy59Jitz2/preview" },
        { day: 3, dateStr: currentYear + "-11-04", displayDate: "Mercredi 4 Novembre", title: "La Météo du Jour", tag: "outil", tagLabel: "Outil Afocal", message: "TBD...", action: ".", file: "." },
        { day: 4, dateStr: currentYear + "-11-05", displayDate: "Jeudi 5 Novembre", title: "Se relaxer", tag: "kit", tagLabel: "Kit Bien-être 2/11", message: "😮‍💨 Les exercices de relaxation permettent de se détendre aussi bien sur le plan physique qu'émotionnel.", action: "Prendre 3 minutes de relaxation dans la journée", file: "Kit - Relaxation", embedUrl : "https://drive.google.com/file/d/1Vy8FPBcVJXtFjIeTjNAo5NGeJdioLnQg/preview" },
        { day: 5, dateStr: currentYear + "-11-06", displayDate: "Vendredi 6 Novembre", title: "Se centrer sur le positif", tag: "kit", tagLabel: "Kit Bien-être 3/11", message: "🌈 Face aux ondes négatives trop présentes, apprenons à nous créer un espace mental plus positif.", action: "Noter 3 réussites ou éléments positifs de la semaine passée.", file: "Kit - Positif", embedUrl : "https://drive.google.com/file/d/1_3yL8uI9jzVNgnBOqs6_1ZD7iD0tuhTh/preview" },
        { day: 6, dateStr: currentYear + "-11-09", displayDate: "Lundi 9 Novembre", title: "Cartes Forces & CPS", tag: "outil", tagLabel: "Outil Afocal", message: "🃏 TBD...", action: ".", file: "." },
        { day: 7, dateStr: currentYear + "-11-10", displayDate: "Mardi 10 Novembre", title: "S'aérer", tag: "kit", tagLabel: "Kit Bien-être 4/11", message: "🌤️ Avez-vous pris un temps, pour vous, pour bien vous aérer aujourd'hui ?", action: "Faire une pause de 15 minutes en extérieur pendant le déjeuner.", file: "Kit - S'aérer", embedUrl : "https://drive.google.com/file/d/1FTv_PycIAialeds6xHd5fsPWCqrdcMaq/preview" },
        { day: 8, dateStr: currentYear + "-11-11", displayDate: "Mercredi 11 Novembre", title: "Manger mieux", tag: "kit", tagLabel: "Kit Bien-être 5/11", message: "🥗 L'alimentation est un pilier de nos vies, au coeur de tout le reste. Retrouvez des repères simples et durables pour mieux s'alimenter.", action: "Choisir une collation saine et s'hydrater régulièrement dans la journée.", file: "Kit - Manger", embedUrl : "https://drive.google.com/file/d/1lcvD4QCujqOVCqzk8UdbrXgRY485xYlm/preview" },
        { day: 9, dateStr: currentYear + "-11-12", displayDate: "Jeudi 12 Novembre", title: "Bien dormir", tag: "kit", tagLabel: "Kit Bien-être 6/11", message: "😴 Bien dormir, c'est se mettre dans de meilleures dispositions énergétiques, physiques et émotionnelles pour la journée à suivre.", action: " Eteindre tous les écrans 30 minutes avant de s'endormir ce soir.", file: "Kit - Sommeil", embedUrl : "https://drive.google.com/file/d/1iN3YEJGayVjCsYT5eHZwbF4HV7MHiT2B/preview" },
        { day: 10, dateStr: currentYear + "-11-13", displayDate: "Vendredi 13 Novembre", title: "Origamis & Créativité", tag: "outil", tagLabel: "Outil Afocal", message: "📄 TBD...", action: ".", file: "." },
        { day: 11, dateStr: currentYear + "-11-16", displayDate: "Lundi 16 Novembre", title: "Bouger plus", tag: "kit", tagLabel: "Kit Bien-être 7/11", message: "🚶 Bouger au quotidien est extrêmement bénefique tant pour votre santé physique que mentale.", action: "Se lever et s'étirer pendant 2 minutes toutes les heures.", file: "Kit - Bouger", embedUrl : "https://drive.google.com/file/d/1vezIvGJJsjzrNZFvdbzXfbrRSzv0dy3j/preview" },
        { day: 12, dateStr: currentYear + "-11-17", displayDate: "Mardi 17 Novembre", title: "Inclusion & Déconnexion", tag: "rso", tagLabel: "Action RSO", message: "🤝 TBD...", action: ".", file: "." },
        { day: 13, dateStr: currentYear + "-11-18", displayDate: "Mercredi 18 Novembre", title: "Être là pour les autres", tag: "kit", tagLabel: "Kit Bien-être 8/11", message: "🎁 Apporter de l'aide à quelqu'un, valoriser le travail d'un collègue ou complimenter un autre fait autant de bien à celui qui donne qu'à celui qui reçoit.", action: "Un sourire, une discussion avec un collègue ou un café offert, tournez vous vers l'autre aujourd'hui !", file: "Kit - Entraide", embedUrl : "https://drive.google.com/file/d/1JgCQOR4ZIedMpSRdHwH63k3e8eOUz-Tk/preview" },
        { day: 14, dateStr: currentYear + "-11-19", displayDate: "Jeudi 19 Novembre", title: "Réduire les substances", tag: "kit", tagLabel: "Kit Bien-être 9/11", message: "🍷 Alcool, sucre, tabac... faire le point sur nos consommations de stimulants et leurs impacts à long terme.", action: "Remplacer une boisson stimulante par une verveine ou de l'eau infusée.", file: "Kit - Addictions", embedUrl : "https://drive.google.com/file/d/1ts9c8BOFvJZvvrYMG3TWMkJkAmW3UcjE/preview" },
        { day: 15, dateStr: currentYear + "-11-20", displayDate: "Vendredi 20 Novembre", title: "Repérer & Orienter (3114)", tag: "outil", tagLabel: "Outil Afocal", message: "🆘 TBD...", action: ".", file: "." },
        { day: 16, dateStr: currentYear + "-11-23", displayDate: "Lundi 23 Novembre", title: "Pratiquer un loisir", tag: "kit", tagLabel: "Kit Bien-être 10/11", message: "🎸 S'engager dans une activité culturelle, sportive ou créative au-delà du travail pour aller bien.", action: "S'organiser un temps réservé à une passion personnelle cette semaine.", file: "Kit - Loisirs", embedUrl : "https://drive.google.com/file/d/1R1gvOCANPsgzJtkTcslwr5HB1-rUe6fY/preview" },
        { day: 17, dateStr: currentYear + "-11-24", displayDate: "Mardi 24 Novembre", title: "Parler quand ça ne va pas", tag: "kit", tagLabel: "Kit Bien-être 11/11", message: "💬 Exprimer ses difficultés permet de prendre du recul, c'est la première marche pour aller mieux.", action: "Consulter les lignes d'écoute et les dispositifs d'accompagnement.", file: "Kit - Parler", embedUrl : "https://drive.google.com/file/d/1h4Fj_nQdnrv1-Wb3AubDI1zmz7jgt6LG/preview" },
        { day: 18, dateStr: currentYear + "-11-25", displayDate: "Mercredi 25 Novembre", title: "Checklist Congés & Bilan", tag: "rso", tagLabel: "Action RSO", message: "🎄 TBD...", action: ".", file: "." }
    ];

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var urlParams = new URLSearchParams(window.location.search);
    var isTestMode = urlParams.get('test') === 'true';

    var grid = document.getElementById('calendar-grid');

    days.forEach(function(data) {
        var parts = data.dateStr.split('-');
        var targetDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        targetDate.setHours(0, 0, 0, 0);

        var isUnlocked = isTestMode || (today >= targetDate);

        var card = document.createElement('div');
        card.className = 'card ' + (isUnlocked ? 'unlocked' : 'locked');
        card.onclick = function() { openModal(data, isUnlocked); };

        var topDiv = document.createElement('div');
        
        var numDiv = document.createElement('div');
        numDiv.className = 'card-number';
        numDiv.textContent = 'Jour ' + data.day;

        var titleDiv = document.createElement('div');
        titleDiv.className = 'card-title';
        titleDiv.textContent = isUnlocked ? data.title : '???';

        topDiv.appendChild(numDiv);
        topDiv.appendChild(titleDiv);

        var bottomDiv = document.createElement('div');
        
        var tagSpan = document.createElement('span');
        if (isUnlocked) {
            tagSpan.className = 'card-tag tag-' + data.tag;
            tagSpan.textContent = data.tagLabel;
        } else {
            tagSpan.className = 'card-tag tag-locked';
            tagSpan.textContent = '🔒 Verrouillé';
        }
        
        bottomDiv.appendChild(tagSpan);

        card.appendChild(topDiv);
        card.appendChild(bottomDiv);

        grid.appendChild(card);
    });

    function openModal(data, isUnlocked) {
        var channelContainer = document.getElementById('modal-channel-container');
        var actionContainer = document.getElementById('modal-action-container');
        var fileContainer = document.getElementById('modal-file-container');
        var fileSpan = document.getElementById('modal-file');
        var iframeEmbed = document.getElementById('modal-embed');

        if (isUnlocked) {
            document.getElementById('modal-title').textContent = 'Jour ' + data.day + ' — ' + data.title;
            
            var tagEl = document.getElementById('modal-tag');
            tagEl.textContent = data.tagLabel;
            tagEl.className = 'card-tag tag-' + data.tag;
            
            document.getElementById('modal-message').textContent = data.message;
            document.getElementById('modal-action').textContent = data.action;

            if (data.fileUrl) {
                fileSpan.innerHTML = '<a href="' + data.fileUrl + '" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: underline;">' + data.file + ' 🔗</a>';
            } else {
                fileSpan.textContent = data.file;
            }

            if (data.embedUrl) {
                var formattedEmbedUrl = data.embedUrl.replace(/\/edit.*$/, '/preview').replace(/\/view.*$/, '/preview');
                iframeEmbed.src = formattedEmbedUrl;
                iframeEmbed.style.display = 'block';
            } else {
                iframeEmbed.src = 'about:blank';
                iframeEmbed.style.display = 'none';
            }

            channelContainer.style.display = 'block';
            actionContainer.style.display = 'block';
            fileContainer.style.display = 'block';
        } else {
            document.getElementById('modal-title').textContent = 'Jour ' + data.day + ' — Case fermée';
            
            var tagEl = document.getElementById('modal-tag');
            tagEl.textContent = '🔒 Pas encore disponible';
            tagEl.className = 'card-tag tag-locked';
            
            document.getElementById('modal-message').textContent = "⏳ Patience ! Cette case s'ouvrira automatiquement le " + data.displayDate + " à 9h00.";
            
            iframeEmbed.src = 'about:blank';
            iframeEmbed.style.display = 'none';

            channelContainer.style.display = 'none';
            actionContainer.style.display = 'none';
            fileContainer.style.display = 'none';
        }

        document.body.style.overflow = 'hidden';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        var iframeEmbed = document.getElementById('modal-embed');
        if (iframeEmbed) {
            iframeEmbed.src = 'about:blank';
        }
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = '';
    }

    // Gestion du clic sur la croix de fermeture
    document.getElementById('modal-close-btn').onclick = closeModal;

    // Gestion du clic à l'extérieur de la carte (sur le fond d'arrière-plan)
    var modalElement = document.getElementById('modal');
    modalElement.onclick = function(event) {
        if (event.target === modalElement) {
            closeModal();
        }
    };
});
</script>

</body>
</html>
